services:
  - type: web
    name: clinica-turnos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api-docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-turnos-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: clinica-turnos-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: clinica-turnos-db
          property: password
      - key: PORT
        value: 8080

databases:
  - name: clinica-turnos-db
    plan: free
    databaseName: clinica_turnos
    user: clinica_user
