spring.application.name=clinica-turnos

# Base de datos — los valores por defecto coinciden con docker-compose.yml
spring.datasource.url=jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:clinica_turnos}}
spring.datasource.username=${PGUSER:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Servidor
server.port=${PORT:8080}

# Frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}
