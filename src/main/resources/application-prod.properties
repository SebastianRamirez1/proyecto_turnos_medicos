# Perfil de producción — Railway / cualquier entorno de despliegue
# Actívalo con: SPRING_PROFILES_ACTIVE=prod

# Seguridad de esquema: "validate" verifica que el esquema coincide
# sin modificarlo (evita cambios accidentales en producción)
# Usa "update" solo si es el primer despliegue o una migración controlada
spring.jpa.hibernate.ddl-auto=update

# Deshabilitar Swagger en producción expone menos superficie de ataque
# Cambiar a false si no se necesita la documentación pública
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Sin SQL en logs de producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Nivel de log más restrictivo
logging.level.root=WARN
logging.level.com.clinica.turnos=INFO
